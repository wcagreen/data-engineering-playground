# dbt profiles.yml
# -----------------
# DBT_PROFILES_DIR env var is set to /opt/airflow/dbt so dbt finds this file
# automatically when run inside the Airflow containers.
#
# To run dbt locally (outside Docker), set:
#   export DBT_PROFILES_DIR=$(pwd)
# and change host to  localhost  and port to  5432.

playground:
  target: dev
  outputs:
    dev:
      type: postgres
      host: "{{ env_var('PLAYGROUND_HOST', 'postgres') }}"
      user: "{{ env_var('PLAYGROUND_USER', 'playground_user') }}"
      password: "{{ env_var('PLAYGROUND_PASSWORD', 'playground_pass') }}"
      port: "{{ env_var('PLAYGROUND_PORT', '5432') | int }}"
      dbname: "{{ env_var('PLAYGROUND_DB', 'playground') }}"
      schema: "{{ env_var('PLAYGROUND_SCHEMA', 'production') }}"  # overridden per model via +schema
      threads: 4
      connect_timeout: 10
