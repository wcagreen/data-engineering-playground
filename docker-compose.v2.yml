# ─────────────────────────────────────────────────────────────────────────────
# Airflow Playground — Docker Compose  (Airflow 2.x profile)
#
# Usage:
#   docker compose -f docker-compose.v2.yml up --build -d
#   docker compose -f docker-compose.v2.yml down
#
# Services:
#   postgres          PostgreSQL 15  (airflow metadata + playground data)
#   redis             Redis 7        (Celery broker)
#   airflow-init      One-time DB migration + admin user creation
#   airflow-webserver Airflow UI  → http://localhost:8080  (admin / admin)
#   airflow-scheduler Airflow scheduler
#   airflow-worker    Celery worker
#   airflow-triggerer Async triggerer
#   python-runner     Script runner  → http://localhost:8000  (ECS/Lambda-style invoke)
#   flower            Celery monitoring → http://localhost:5555  (--profile flower)
#   pgadmin           pgAdmin 4      → http://localhost:5050  (--profile pgadmin)
#
# DockerOperator support
#   The Docker socket is mounted into all Airflow containers so any task can
#   spin up a fresh container via DockerOperator (local ECS-RunTask equivalent).
#
# NOTE: Uses separate Docker volumes (postgres-db-v2, pgadmin-v2) so data
#       does not conflict with the v3 profile.  Run only one profile at a time
#       to avoid port conflicts on 8080, 5432 and 5050.
# ─────────────────────────────────────────────────────────────────────────────

version: '3.8'

# ─── Shared Airflow 2.x configuration ────────────────────────────────────────
x-airflow-common: &airflow-common
  build:
    context: .
    dockerfile: Dockerfile.v2
  environment: &airflow-common-env
    AIRFLOW__CORE__EXECUTOR: CeleryExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://postgres:postgres@postgres/airflow
    AIRFLOW__CELERY__RESULT_BACKEND: db+postgresql://postgres:postgres@postgres/airflow
    AIRFLOW__CELERY__BROKER_URL: redis://:@redis:6379/0
    AIRFLOW__CORE__FERNET_KEY: ''
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: 'true'
    AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
    AIRFLOW__SCHEDULER__ENABLE_HEALTH_CHECK: 'true'
    # Airflow 2.x uses FAB for auth — user is created via _AIRFLOW_WWW_USER_* vars in airflow-init
    # Auto-register the playground PostgreSQL connection (conn_id: playground_postgres)
    AIRFLOW_CONN_PLAYGROUND_POSTGRES: 'postgresql://playground_user:playground_pass@postgres:5432/playground'
    # Tell dbt where to find profiles.yml
    DBT_PROFILES_DIR: /opt/airflow/dbt
  volumes:
    - ./dags:/opt/airflow/dags
    - ./logs:/opt/airflow/logs
    - ./plugins:/opt/airflow/plugins
    - ./data:/opt/airflow/data
    - ./sql:/opt/airflow/sql
    - ./soda:/opt/airflow/soda
    - ./dbt:/opt/airflow/dbt
    - ./scripts/python:/opt/airflow/scripts/python
    - /var/run/docker.sock:/var/run/docker.sock  # DockerOperator: lets tasks spin up containers
  user: "${AIRFLOW_UID:-50000}:0"
  depends_on: &airflow-common-depends-on
    redis:
      condition: service_healthy
    postgres:
      condition: service_healthy

services:

  # ─── PostgreSQL ──────────────────────────────────────────────────────────────
  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: airflow
    volumes:
      - postgres-db-v2:/var/lib/postgresql/data
      - ./scripts/init:/docker-entrypoint-initdb.d
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres"]
      interval: 10s
      retries: 5
      start_period: 5s
    restart: always

  # ─── Redis ───────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    expose:
      - 6379
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 30s
      retries: 50
      start_period: 30s
    restart: always

  # ─── Airflow Init ─────────────────────────────────────────────────────────────
  # Runs once: migrates the metadata DB and creates the admin user.
  airflow-init:
    <<: *airflow-common
    entrypoint: /bin/bash
    command:
      - -c
      - |
        mkdir -p /sources/logs /sources/dags /sources/plugins /sources/data/raw /sources/data/processed
        chown -R "${AIRFLOW_UID:-50000}:0" /sources/{logs,dags,plugins,data}
        exec /entrypoint airflow version
    environment:
      <<: *airflow-common-env
      _AIRFLOW_DB_MIGRATE: 'true'
      _AIRFLOW_WWW_USER_CREATE: 'true'
      _AIRFLOW_WWW_USER_USERNAME: ${_AIRFLOW_WWW_USER_USERNAME:-admin}
      _AIRFLOW_WWW_USER_PASSWORD: ${_AIRFLOW_WWW_USER_PASSWORD:-admin}
    user: "0:0"
    volumes:
      - .:/sources

  # ─── Airflow Webserver (Airflow 2.x FAB UI) ──────────────────────────────────
  airflow-webserver:
    <<: *airflow-common
    command: webserver
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: always
    depends_on:
      <<: *airflow-common-depends-on
      airflow-init:
        condition: service_completed_successfully

  # ─── Airflow Scheduler ───────────────────────────────────────────────────────
  airflow-scheduler:
    <<: *airflow-common
    command: scheduler
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8974/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: always
    depends_on:
      <<: *airflow-common-depends-on
      airflow-init:
        condition: service_completed_successfully

  # ─── Airflow Celery Worker ───────────────────────────────────────────────────
  airflow-worker:
    <<: *airflow-common
    command: celery worker --celery-hostname worker@%h
    healthcheck:
      test:
        - "CMD-SHELL"
        - 'celery --app airflow.providers.celery.executors.celery_executor.app inspect ping -d "celery@$${HOSTNAME}" || celery --app airflow.executors.celery_executor.app inspect ping -d "celery@$${HOSTNAME}"'
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    environment:
      <<: *airflow-common-env
      DUMB_INIT_SETSID: "0"
    restart: always
    depends_on:
      <<: *airflow-common-depends-on
      airflow-init:
        condition: service_completed_successfully

  # ─── Airflow Triggerer ───────────────────────────────────────────────────────
  airflow-triggerer:
    <<: *airflow-common
    command: triggerer
    healthcheck:
      test: ["CMD-SHELL", 'airflow jobs check --job-type TriggererJob --hostname "$${HOSTNAME}"']
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: always
    depends_on:
      <<: *airflow-common-depends-on
      airflow-init:
        condition: service_completed_successfully

  # ─── Celery Flower (optional monitoring UI) ───────────────────────────────────  # Start with: docker compose -f docker-compose.v2.yml --profile flower up  flower:
    <<: *airflow-common
    command: celery flower
    profiles:
      - flower
    ports:
      - "5555:5555"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:5555/"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: always
    depends_on:
      <<: *airflow-common-depends-on
      airflow-init:
        condition: service_completed_successfully

  # ─── Python Script Runner ─────────────────────────────────────────────────
  # ECS / Lambda-style invoke pattern: Airflow tasks POST a script name to
  # this container and it runs it, returning stdout/stderr and exit code.
  #
  # POST http://python-runner:8000/run
  #   {"script": "example_script.py", "args": ["--input", "/scripts/data.csv"]}
  #
  # The scripts/python/ directory is mounted as /scripts/ — drop any .py file
  # there and it becomes immediately runnable without rebuilding.
  python-runner:
    build:
      context: .
      dockerfile: Dockerfile.runner
    ports:
      - "8000:8000"
    volumes:
      - ./scripts/python:/scripts
    environment:
      SCRIPTS_DIR: /scripts
      RUNNER_PORT: "8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    restart: always

  # ─── pgAdmin (optional) ──────────────────────────────────────────────────────
  # Start with: docker compose -f docker-compose.v2.yml --profile pgadmin up
  pgadmin:
    image: dpage/pgadmin4:latest
    profiles:
      - pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@example.com
      PGADMIN_DEFAULT_PASSWORD: admin
      PGADMIN_LISTEN_PORT: 5050
    ports:
      - "5050:5050"
    volumes:
      - pgadmin-v2:/var/lib/pgadmin
      - ./scripts/pgadmin/servers.json:/pgadmin4/servers.json:ro
    depends_on:
      postgres:
        condition: service_healthy
    restart: always


volumes:
  postgres-db-v2:
  pgadmin-v2:
