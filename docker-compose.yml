# ─────────────────────────────────────────────────────────────────────────────
# Airflow Playground — Docker Compose
#
# Services:
#   postgres          PostgreSQL 15  (airflow metadata + playground data)
#   redis             Redis 7        (Celery broker)
#   airflow-init      One-time DB migration + admin user creation
#   airflow-webserver Airflow UI  → http://localhost:8080  (admin / admin)
#   airflow-scheduler Airflow scheduler
#   airflow-dag-processor DAG parser/serializer (required for DAG discovery)
#   airflow-worker    Celery worker
#   airflow-triggerer Async triggerer
#   python-runner     Script runner  → http://localhost:8000  (ECS/Lambda-style invoke without the multiple images)
#   flower            Celery monitoring → http://localhost:5555  (--profile flower)
#   pgadmin           pgAdmin 4      → http://localhost:5050  (--profile pgadmin)
#
# DockerOperator support
#   The Docker socket is mounted into all Airflow containers so any task can
#   spin up a fresh container via DockerOperator (local ECS-RunTask equivalent).
# ─────────────────────────────────────────────────────────────────────────────

# ─── Shared Airflow configuration ─────────────────────────────────────────────
x-airflow-common: &airflow-common
  build:
    context: .
    dockerfile: ${AIRFLOW_DOCKERFILE:-Dockerfile}
  environment: &airflow-common-env
    AIRFLOW__CORE__EXECUTOR: CeleryExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: "postgresql+psycopg2://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres/${POSTGRES_DB:-airflow}"
    AIRFLOW__CELERY__RESULT_BACKEND: "db+postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres/${POSTGRES_DB:-airflow}"
    AIRFLOW__CELERY__BROKER_URL: redis://:@redis:6379/0
    AIRFLOW__CORE__FERNET_KEY: ''
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: 'true'
    AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
    AIRFLOW__SCHEDULER__ENABLE_HEALTH_CHECK: 'true'
    AIRFLOW__CORE__INTERNAL_API_SECRET_KEY: ${AIRFLOW_INTERNAL_API_SECRET_KEY:-airflow-playground-internal-api-secret}
    AIRFLOW__CORE__EXECUTION_API_SERVER_URL: ${AIRFLOW_EXECUTION_API_SERVER_URL:-http://airflow-webserver:8080/execution/}
    AIRFLOW__EXECUTION_API__SECRET_KEY: ${AIRFLOW_EXECUTION_API_SECRET_KEY:-airflow-playground-execution-api-secret}
    AIRFLOW__API_AUTH__JWT_SECRET: ${AIRFLOW_API_AUTH_JWT_SECRET:-airflow-playground-api-auth-secret}
    # Airflow 3.0 SimpleAuthManager — define users and point to passwords file
    # Users format: "username:ROLE" — valid roles: VIEWER, USER, OP, ADMIN
    AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_USERS: 'admin:ADMIN'
    AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_PASSWORDS_FILE: '/opt/airflow/scripts/airflow/passwords.json'
    # Auto-register the playground PostgreSQL connection (conn_id: playground_postgres)
    AIRFLOW_CONN_PLAYGROUND_POSTGRES: "postgresql://${PLAYGROUND_USER:-playground_user}:${PLAYGROUND_PASSWORD:-playground_pass}@postgres:5432/${PLAYGROUND_DB:-playground}"
    # Tell dbt where to find profiles.yml
    DBT_PROFILES_DIR: /opt/airflow/dbt
  volumes:
    - ./dags:/opt/airflow/dags              # live-reload: save a DAG file → Airflow picks it up instantly
    - ./logs:/opt/airflow/logs
    - ./plugins:/opt/airflow/plugins
    - ./data:/opt/airflow/data
    - ./sql:/opt/airflow/sql
    - ./soda:/opt/airflow/soda
    - ./dbt:/opt/airflow/dbt
    - ./scripts/python:/opt/airflow/scripts/python  # etl_transforms.py and other scripts
    - ./scripts/airflow:/opt/airflow/scripts/airflow  # SimpleAuthManager passwords file
    - /var/run/docker.sock:/var/run/docker.sock  # DockerOperator: lets tasks spin up containers
  user: "${AIRFLOW_UID:-50000}:0"
  depends_on: &airflow-common-depends-on
    redis:
      condition: service_healthy
    postgres:
      condition: service_healthy

services:

  # ─── PostgreSQL ──────────────────────────────────────────────────────────────
  # Hosts two databases:
  #   airflow    — Airflow metadata (managed by Airflow internally)
  #   playground — Your data: schemas "staging" and "production"
  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-airflow}
      PLAYGROUND_DB: ${PLAYGROUND_DB:-playground}
      PLAYGROUND_USER: ${PLAYGROUND_USER:-playground_user}
      PLAYGROUND_PASSWORD: ${PLAYGROUND_PASSWORD:-playground_pass}
    volumes:
      - postgres-db-volume:/var/lib/postgresql/data
      - ./scripts/init:/docker-entrypoint-initdb.d   # runs once on first start
    ports:
      - "${HOST_BIND:-127.0.0.1}:5432:5432"
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres"]
      interval: 10s
      retries: 5
      start_period: 5s
    restart: always

  # ─── Redis ───────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    expose:
      - 6379
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 30s
      retries: 50
      start_period: 30s
    restart: always

  # ─── Airflow Init ─────────────────────────────────────────────────────────────
  # Runs once: migrates the metadata DB and creates the admin user.
  airflow-init:
    <<: *airflow-common
    entrypoint: /bin/bash
    command:
      - -c
      - |
        mkdir -p /sources/logs /sources/dags /sources/plugins /sources/data/raw /sources/data/processed
        chown -R "${AIRFLOW_UID:-50000}:0" /sources/{logs,dags,plugins,data}
        exec /entrypoint airflow version
    environment:
      <<: *airflow-common-env
      _AIRFLOW_DB_MIGRATE: 'true'
      _AIRFLOW_WWW_USER_CREATE: 'true'
      _AIRFLOW_WWW_USER_USERNAME: ${_AIRFLOW_WWW_USER_USERNAME:-admin}
      _AIRFLOW_WWW_USER_PASSWORD: ${_AIRFLOW_WWW_USER_PASSWORD:-admin}
    user: "0:0"
    volumes:
      - .:/sources

  # ─── Airflow API Server (replaces webserver in Airflow 3.0) ─────────────────
  airflow-webserver:
    <<: *airflow-common
    command: ${AIRFLOW_WEBSERVER_COMMAND:-api-server}
    ports:
      - "${HOST_BIND:-127.0.0.1}:8080:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "${AIRFLOW_WEBSERVER_HEALTHCHECK_URL:-http://localhost:8080/api/v2/monitor/health}"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: always
    depends_on:
      <<: *airflow-common-depends-on
      airflow-init:
        condition: service_completed_successfully

  # ─── Airflow Scheduler ───────────────────────────────────────────────────────
  airflow-scheduler:
    <<: *airflow-common
    command: scheduler
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8974/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: always
    depends_on:
      <<: *airflow-common-depends-on
      airflow-init:
        condition: service_completed_successfully

  # ─── Airflow DAG Processor ───────────────────────────────────────────────────
  # Parses DAG files and writes serialized DAGs for the webserver/scheduler.
  airflow-dag-processor:
    <<: *airflow-common
    command: dag-processor
    healthcheck:
      test: ["CMD-SHELL", 'airflow jobs check --job-type DagProcessorJob --hostname "$${HOSTNAME}"']
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: always
    depends_on:
      <<: *airflow-common-depends-on
      airflow-init:
        condition: service_completed_successfully

  # ─── Airflow Celery Worker ───────────────────────────────────────────────────
  airflow-worker:
    <<: *airflow-common
    command: ${AIRFLOW_WORKER_COMMAND:-celery worker --celery-hostname worker@%h --pid /tmp/celery-worker.pid}
    healthcheck:
      test:
        - "CMD-SHELL"
        - 'celery --app airflow.providers.celery.executors.celery_executor.app inspect ping -d "worker@$${HOSTNAME}" || celery --app airflow.providers.celery.executors.celery_executor.app inspect ping'
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    environment:
      <<: *airflow-common-env
      DUMB_INIT_SETSID: "0"
    restart: always
    depends_on:
      <<: *airflow-common-depends-on
      airflow-init:
        condition: service_completed_successfully

  # ─── Airflow Triggerer ───────────────────────────────────────────────────────
  airflow-triggerer:
    <<: *airflow-common
    command: triggerer
    healthcheck:
      test: ["CMD-SHELL", 'airflow jobs check --job-type TriggererJob --hostname "$${HOSTNAME}"']
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: always
    depends_on:
      <<: *airflow-common-depends-on
      airflow-init:
        condition: service_completed_successfully

  # ─── Celery Flower (optional monitoring UI) ───────────────────────────────────
  # Start with: docker compose --profile flower up
  flower:
    <<: *airflow-common
    command: celery flower
    profiles:
      - flower
    ports:
      - "${HOST_BIND:-127.0.0.1}:5555:5555"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:5555/"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: always
    depends_on:
      <<: *airflow-common-depends-on
      airflow-init:
        condition: service_completed_successfully

  # ─── Python Script Runner ─────────────────────────────────────────────────
  # ECS / Lambda-style invoke pattern: Airflow tasks POST a script name to
  # this container and it runs it, returning stdout/stderr and exit code.
  #
  # POST http://python-runner:8000/run
  #   {"script": "example_script.py", "args": ["--input", "/scripts/data.csv"]}
  #
  # The scripts/python/ directory is mounted as /scripts/ — drop any .py file
  # there and it becomes immediately runnable without rebuilding.
  python-runner:
    build:
      context: .
      dockerfile: Dockerfile.runner
    ports:
      - "${HOST_BIND:-127.0.0.1}:8000:8000"
    volumes:
      - ./scripts/python:/scripts
    environment:
      SCRIPTS_DIR: /scripts
      RUNNER_PORT: "8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    restart: always

  # ─── pgAdmin (optional) ──────────────────────────────────────────────────────
  # Start with: docker compose --profile pgadmin up
  pgadmin:
    image: dpage/pgadmin4:latest
    profiles:
      - pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:-admin@example.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:-admin}
      PGADMIN_LISTEN_PORT: 5050
    ports:
      - "${HOST_BIND:-127.0.0.1}:5050:5050"
    volumes:
      - pgadmin-volume:/var/lib/pgadmin
      - ./scripts/pgadmin/servers.json:/pgadmin4/servers.json:ro
    depends_on:
      postgres:
        condition: service_healthy
    restart: always


volumes:
  postgres-db-volume:
    name: airflow-playground-postgres-${AIRFLOW_STACK_VARIANT:-v3}
  pgadmin-volume:
    name: airflow-playground-pgadmin-${AIRFLOW_STACK_VARIANT:-v3}
